<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Flamingo · Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <script>
    // Sin parpadeo de color: aplica el tema guardado antes de pintar.
    try {
      var s = JSON.parse(localStorage.getItem("elflamingo.settings"));
      if (s && (s.theme === "light" || s.theme === "dark")) document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">El Flamingo</a>
    <input id="search" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
    <a id="adminLink" class="adm" href="#/admin">Admin</a>
    <button id="settingsBtn" type="button" class="settings-btn" aria-label="Configuración">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status"></div>
  <dialog id="settings" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Configuración</h2>
    <fieldset class="theme-group">
      <legend>Tema</legend>
      <label class="theme-opt"><input type="radio" name="theme" value="system" checked> Sistema</label>
      <label class="theme-opt"><input type="radio" name="theme" value="light"> Claro</label>
      <label class="theme-opt"><input type="radio" name="theme" value="dark"> Oscuro</label>
    </fieldset>
    <div class="actions"><button type="button" class="btn" id="closeSettings">Cerrar</button></div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
